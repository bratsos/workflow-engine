name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/workflow-engine/src/**'
      - 'packages/workflow-engine/skills/workflow-engine/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/workflow-engine/src/**'
      - 'packages/workflow-engine/skills/workflow-engine/migrations/**'

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # Deploys from main run in order, so an older build cannot replace a newer one.
    concurrency: docs-${{ github.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        if: github.event_name == 'pull_request'
        run: pnpm --filter workflow-engine-docs build

      # cf-deploy builds first, so a push to main builds once.
      - name: Build and deploy docs
        if: github.event_name == 'push'
        run: pnpm --filter workflow-engine-docs run cf-deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
