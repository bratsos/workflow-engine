name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/workflow-engine/src/**'
      - 'packages/workflow-engine/skills/workflow-engine/migrations/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'packages/workflow-engine/src/**'
      - 'packages/workflow-engine/skills/workflow-engine/migrations/**'

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm --filter workflow-engine-docs build

      # Deploys happen outside this workflow: Cloudflare Workers Builds is
      # connected to the repository and runs
      # `pnpm --filter workflow-engine-docs run cf-deploy` (see
      # apps/docs/wrangler.jsonc). This job only checks that the site builds.
