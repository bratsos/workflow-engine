name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome check .

      - name: Build
        run: pnpm --filter '!workflow-engine-docs' -r build

      - name: Type check
        run: pnpm --filter '!workflow-engine-docs' -r typecheck

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test

  postgres-conformance:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        prisma-major: ["6", "7", "8"]
        timezone: ["UTC", "Pacific/Kiritimati"]
        # Prisma 8 only provisions a database and diffs its schema against
        # Prisma 7's for now, which does not depend on the session timezone.
        # Drop this exclude, and the `!= '8'` conditions below, when the
        # suites run on Prisma 8.
        exclude:
          - prisma-major: "8"
            timezone: "Pacific/Kiritimati"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflow_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test
      PRISMA_MAJOR: ${{ matrix.prisma-major }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @bratsos/workflow-engine
          --filter @bratsos/workflow-engine-console
          --filter "./packages/prisma-fixtures/*"

      - name: Set the database session timezone
        run: psql "$DATABASE_URL" -c "ALTER DATABASE workflow_engine_test SET timezone TO '${{ matrix.timezone }}'"

      # On Prisma 8 these two emit the contract and provision the database
      # with `prisma migration plan` and `prisma db migrate`.
      - name: Generate Prisma client
        run: pnpm --filter @bratsos/workflow-engine run prisma:generate

      - name: Push Prisma schema to Postgres
        run: pnpm --filter @bratsos/workflow-engine run prisma:db-push

      - name: Provision Prisma 7 as the reference and diff the Prisma 8 schema against it
        if: matrix.prisma-major == '8'
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE workflow_engine_reference'
          PRISMA_MAJOR=7 DATABASE_URL=postgresql://postgres:postgres@localhost:5432/workflow_engine_reference \
            pnpm --filter @bratsos/workflow-engine run prisma:db-push
          node packages/prisma-fixtures/v8/scripts/schema-diff.mjs \
            postgresql://postgres:postgres@localhost:5432/workflow_engine_reference "$DATABASE_URL"

      - name: Run Postgres conformance tests
        if: matrix.prisma-major != '8'
        run: pnpm --filter @bratsos/workflow-engine run test:pg
        env:
          NODE_ENV: test

      - name: Run console Postgres tests
        if: matrix.prisma-major != '8'
        run: pnpm --filter @bratsos/workflow-engine-console exec vitest run src/__tests__/prisma-read-port.postgres.test.ts
        env:
          NODE_ENV: test
