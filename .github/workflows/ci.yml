name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22", "24"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm biome check .

      - name: Build
        run: pnpm --filter '!workflow-engine-docs' -r build

      - name: Type check
        run: pnpm --filter '!workflow-engine-docs' -r typecheck

      # Compiles a Prisma 8 consumer against the packages Build just produced:
      # every port factory over `fromPrisma8(db)` and over a transaction's `tx`.
      - name: Type check a Prisma 8 consumer
        run: |
          pnpm --filter workflow-engine-prisma-v8 run generate
          pnpm --filter workflow-engine-prisma-v8 run check:consumer

      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test

  # A change to the Prisma schemas or the SQL needs a changeset that says
  # "rolling-safe" or "stop old hosts first" (CONTRIBUTING.md).
  changeset-rollout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check that a schema or SQL change states its rollout
        run: >-
          git diff --name-only
          "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          | node scripts/check-changeset-rollout.mjs

  postgres-conformance:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        prisma-major: ["6", "7", "8"]
        timezone: ["UTC", "Pacific/Kiritimati"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflow_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test
      PRISMA_MAJOR: ${{ matrix.prisma-major }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @bratsos/workflow-engine
          --filter @bratsos/workflow-engine-console
          --filter @bratsos/workflow-engine-host-node
          --filter @bratsos/workflow-engine-host-serverless
          --filter "./packages/prisma-fixtures/*"

      - name: Set the database session timezone
        run: psql "$DATABASE_URL" -c "ALTER DATABASE workflow_engine_test SET timezone TO '${{ matrix.timezone }}'"

      # A hook timeout in this job has been either a slow runner or a lock
      # wait. With these two settings the server log tells them apart; the
      # last step prints it when the job fails.
      - name: Log lock waits and slow statements
        run: >-
          psql "$DATABASE_URL"
          -c "ALTER SYSTEM SET log_lock_waits = on"
          -c "ALTER SYSTEM SET log_min_duration_statement = 1000"
          -c "SELECT pg_reload_conf()"

      # On Prisma 8 these two emit the contract and provision the database
      # with `prisma migration plan` and `prisma db migrate`.
      - name: Generate Prisma client
        run: pnpm --filter @bratsos/workflow-engine run prisma:generate

      - name: Push Prisma schema to Postgres
        run: pnpm --filter @bratsos/workflow-engine run prisma:db-push

      - name: Provision Prisma 7 as the reference and diff the Prisma 8 schema against it
        if: matrix.prisma-major == '8'
        run: |
          psql "$DATABASE_URL" -c 'CREATE DATABASE workflow_engine_reference'
          PRISMA_MAJOR=7 DATABASE_URL=postgresql://postgres:postgres@localhost:5432/workflow_engine_reference \
            pnpm --filter @bratsos/workflow-engine run prisma:db-push
          node packages/prisma-fixtures/v8/scripts/schema-diff.mjs \
            postgresql://postgres:postgres@localhost:5432/workflow_engine_reference "$DATABASE_URL"

      - name: Run Postgres conformance tests
        run: pnpm --filter @bratsos/workflow-engine run test:pg
        env:
          NODE_ENV: test

      - name: Run host outbox recovery tests on Postgres
        run: |
          pnpm --filter @bratsos/workflow-engine-host-node exec vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts
          pnpm --filter @bratsos/workflow-engine-host-serverless exec vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts
        env:
          NODE_ENV: test

      # cli.test.ts imports the built UI bundle, which the package's own `test`
      # script builds first.
      - name: Run console Postgres tests
        run: |
          pnpm --filter @bratsos/workflow-engine-console exec node scripts/build-ui.mjs
          pnpm --filter @bratsos/workflow-engine-console exec vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/prisma-read-port.postgres.test.ts src/__tests__/cli.test.ts
        env:
          NODE_ENV: test

      - name: Print the Postgres log and open locks after a failure
        if: failure()
        run: |
          docker logs "${{ job.services.postgres.id }}" 2>&1 | tail -n 300
          psql "$DATABASE_URL" -c "select pid, state, wait_event_type, wait_event, now() - xact_start as xact_age, left(query, 120) as query from pg_stat_activity where datname = current_database() and pid <> pg_backend_pid()"
          psql "$DATABASE_URL" -c "select locktype, relation::regclass, mode, granted, pid from pg_locks where not granted"

  sqlite-conformance:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        prisma-major: ["6", "7", "8"]
        node-version: ["24"]
        include:
          # Floor rows: the lowest Node 22 the install accepts (the workspace's
          # prisma@7.10.1 refuses to install below 22.12), and the Prisma 8
          # SQLite floors from the docs.
          - { prisma-major: "6", node-version: "22.12.0" }
          - { prisma-major: "7", node-version: "22.12.0" }
          - { prisma-major: "8", node-version: "22.20.0" }
          - { prisma-major: "8", node-version: "24.11.0" }
          - { prisma-major: "8", node-version: "26.0.0" }

    env:
      PRISMA_MAJOR: ${{ matrix.prisma-major }}
      SQLITE8_KERNEL_SQLITE: "1"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @bratsos/workflow-engine
          --filter @bratsos/workflow-engine-console
          --filter @bratsos/workflow-engine-host-node
          --filter @bratsos/workflow-engine-host-serverless
          --filter "./packages/prisma-fixtures/*"

      - name: Build engine for the console Prisma 8 shim import
        run: pnpm --filter @bratsos/workflow-engine run build

      - name: Run engine SQLite conformance tests
        run: pnpm --filter @bratsos/workflow-engine run test:sqlite

      - name: Run host outbox recovery tests on SQLite
        run: |
          pnpm --filter @bratsos/workflow-engine-host-node exec vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts
          pnpm --filter @bratsos/workflow-engine-host-serverless exec vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts

      - name: Run console SQLite conformance tests
        run: |
          pnpm --filter @bratsos/workflow-engine-console exec node scripts/build-ui.mjs
          pnpm --filter @bratsos/workflow-engine-console exec vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/prisma-read-port.sqlite.test.ts

  # The Prisma 8 Postgres and SQLite suites with Bun as the runtime, for
  # users who run the engine on Bun. `bun --bun` makes Bun run the `vitest`
  # and `prisma` binaries (whose shebang says node). Node installs the
  # packages and provides the 24.x that Prisma 8 SQLite requires.
  bun-conformance:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        database: ["postgres", "sqlite"]

    # Known red: under Bun's node:sqlite, the journal-mode and root-connection
    # cases in sqlite8-kernel-concurrency.test.ts and from-prisma8-sqlite.test.ts
    # fail with "database is locked" where Node passes them; they are listed in
    # the ci lane report. The Postgres row stays a hard gate.
    continue-on-error: ${{ matrix.database == 'sqlite' }}

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workflow_engine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PRISMA_MAJOR: "8"
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: >-
          pnpm install --frozen-lockfile
          --filter @bratsos/workflow-engine
          --filter @bratsos/workflow-engine-console
          --filter @bratsos/workflow-engine-host-node
          --filter @bratsos/workflow-engine-host-serverless
          --filter "./packages/prisma-fixtures/*"

      - name: Build engine for the console Prisma 8 shim import
        run: pnpm --filter @bratsos/workflow-engine run build

      - name: Generate Prisma client
        if: matrix.database == 'postgres'
        run: bun --bun run --cwd packages/workflow-engine prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test

      - name: Push Prisma schema to Postgres
        if: matrix.database == 'postgres'
        run: bun --bun run --cwd packages/workflow-engine prisma:db-push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test

      - name: Run Postgres conformance tests
        if: matrix.database == 'postgres'
        run: bun --bun run --cwd packages/workflow-engine test:pg
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test

      - name: Run host outbox recovery tests on Postgres
        if: matrix.database == 'postgres'
        run: |
          bun --bun run --cwd packages/workflow-engine-host-node vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts
          bun --bun run --cwd packages/workflow-engine-host-serverless vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test

      - name: Run console Postgres tests
        if: matrix.database == 'postgres'
        run: |
          bun --bun packages/workflow-engine-console/scripts/build-ui.mjs
          bun --bun run --cwd packages/workflow-engine-console vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/prisma-read-port.postgres.test.ts src/__tests__/cli.test.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workflow_engine_test

      - name: Run engine SQLite conformance tests
        if: matrix.database == 'sqlite'
        run: bun --bun run --cwd packages/workflow-engine test:sqlite
        env:
          SQLITE8_KERNEL_SQLITE: "1"

      - name: Run host outbox recovery tests on SQLite
        if: matrix.database == 'sqlite'
        run: |
          bun --bun run --cwd packages/workflow-engine-host-node vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts
          bun --bun run --cwd packages/workflow-engine-host-serverless vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/outbox-prisma.test.ts

      - name: Run console SQLite conformance tests
        if: matrix.database == 'sqlite'
        run: |
          bun --bun packages/workflow-engine-console/scripts/build-ui.mjs
          bun --bun run --cwd packages/workflow-engine-console vitest run --hookTimeout=30000 --testTimeout=30000 src/__tests__/prisma-read-port.sqlite.test.ts
